name: gh-jira-sync
# Reusable workflow: call it from any repository, in any organization, to run one sync
# deployment. Each deployment needs its own config file and its own state branch.
#
# Call a release, and that release's binary runs:
#   uses: cccteam/gh-jira-sync/.github/workflows/sync-reusable.yml@vX.Y.Z
# The binary is downloaded from the release and checked against its checksum and its
# build provenance attestation before any sync secret is in the environment.
on:
  workflow_call:
    inputs:
      config:
        description: Path to the sync configuration in the calling repository
        type: string
        default: sync.json
      state-branch:
        description: Dedicated state branch in the calling repository (sync-state or sync-state-<name>)
        type: string
        default: sync-state
      apply:
        description: Apply remote changes (otherwise dry-run)
        type: boolean
        default: false
      initialize:
        description: Allow first-run state initialization
        type: boolean
        default: false
      version:
        description: >-
          Release of gh-jira-sync to run. Defaults to the release this workflow file
          belongs to, so `uses: ...@vX.Y.Z` runs vX.Y.Z.
        type: string
        default: v0.1.2 # x-release-please-version
      tool-ref:
        description: >-
          Build cccteam/gh-jira-sync from this ref instead of downloading a release, for
          testing unreleased commits. Leave empty in normal use.
        type: string
        default: ''
      app-client-id:
        description: >-
          Client ID of a GitHub App, installed in the synced repository's organization,
          that supplies the GitHub tokens: Issues read/write on the configured repository,
          and organization Projects read/write for project_status. Each run mints a
          separate short-lived token per purpose, limited to that repository and permission.
        type: string
        default: ''
    secrets:
      # Jira credentials: pass jira-email and jira-api-token, or a service account's
      # jira-client-id and jira-client-secret (which need jira_cloud_id), not both.
      jira-email:
        description: Jira Cloud account email, for API token authentication
        required: false
      jira-api-token:
        description: API token for that account
        required: false
      jira-client-id:
        description: Client ID of a Jira service account's OAuth 2.0 credential
        required: false
      jira-client-secret:
        description: Client secret of that OAuth 2.0 credential
        required: false
      app-private-key:
        description: Private key of the GitHub App named by app-client-id
        required: false
      # Alternatives to the App, for callers that cannot use one. Each, when passed,
      # takes precedence over the matching App token.
      github-token:
        description: >-
          Token with issue read/write on the configured repository. Without it or the
          App, the caller's GITHUB_TOKEN is used, which only covers the calling repository.
        required: false
      tool-token:
        description: Deprecated and ignored; cccteam/gh-jira-sync is public, so no token is needed to fetch it.
        required: false
      project-token:
        description: >-
          Token with Projects read/write for project_status, for example a fine-grained
          token for a user-owned project.
        required: false

jobs:
  sync:
    # Only trusted default-branch code may run with secrets. Scheduled runs always use
    # the default branch, and their event payload carries no repository details.
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One writer per state branch; never cancel a run mid-journal.
    concurrency:
      group: gh-jira-sync-${{ github.repository }}-${{ inputs.state-branch }}
      cancel-in-progress: false
    steps:
      # The calling repository: its config, and the remote that holds the state branch.
      # The workflow's own token pushes the state branch; App tokens never need contents write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Which repository and project owner to mint tokens for comes from the config.
      - name: Read config
        id: config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          if [ ! -f "$CONFIG" ]; then
            echo "::error::Config file $CONFIG not found in the calling repository"
            exit 1
          fi
          repo=$(jq -r '.repository // ""' "$CONFIG")
          project_owner=$(jq -r '.project_status.owner // ""' "$CONFIG")
          if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ ! "$project_owner" =~ ^[A-Za-z0-9-]*$ ]]; then
            echo "::error::$CONFIG needs a repository of the form owner/name"
            exit 1
          fi
          {
            echo "repo-owner=${repo%%/*}"
            echo "repo-name=${repo#*/}"
            echo "project-owner=$project_owner"
          } >> "$GITHUB_OUTPUT"
      # A release binary, verified, unless tool-ref asks for a build from source.
      - name: Download release
        if: inputs.tool-ref == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a release tag such as v1.2.3, not $VERSION"
            exit 1
          fi
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) platform=linux_amd64 ;;
            Linux/ARM64) platform=linux_arm64 ;;
            macOS/X64) platform=darwin_amd64 ;;
            macOS/ARM64) platform=darwin_arm64 ;;
            *) echo "::error::No gh-jira-sync release build for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          archive="gh-jira-sync_${VERSION#v}_${platform}.tar.gz"
          dir="$RUNNER_TEMP/gh-jira-sync-release"
          gh release download "$VERSION" --repo cccteam/gh-jira-sync \
            --pattern "$archive" --pattern checksums.txt --dir "$dir"
          (cd "$dir" && grep -F "  $archive" checksums.txt | shasum -a 256 --check --strict)
          # Proves the archive was built by this repository's release workflow from the tag.
          gh attestation verify "$dir/$archive" --repo cccteam/gh-jira-sync \
            --signer-workflow cccteam/gh-jira-sync/.github/workflows/release-assets.yml \
            --source-ref "refs/tags/$VERSION"
          tar -xzf "$dir/$archive" -C "$dir"
          mv "$dir/${archive%.tar.gz}/gh-jira-sync" "$RUNNER_TEMP/gh-jira-sync"
          rm -rf "$dir"
          "$RUNNER_TEMP/gh-jira-sync" -version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.tool-ref != ''
        with:
          repository: cccteam/gh-jira-sync
          ref: ${{ inputs.tool-ref }}
          path: .gh-jira-sync-tool
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.tool-ref != ''
        with:
          go-version-file: .gh-jira-sync-tool/go.mod
          cache: false
      # Built before any sync secret is in the environment.
      - name: Build from source
        if: inputs.tool-ref != ''
        run: |
          go build -C .gh-jira-sync-tool -o "$RUNNER_TEMP/gh-jira-sync" .
          rm -rf .gh-jira-sync-tool
      # Each App token below covers one purpose, one repository or owner, and only the
      # permissions it needs. They expire within an hour and are revoked when the job ends.
      - name: Issues token
        id: issues-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.config.outputs.repo-owner }}
          repositories: ${{ steps.config.outputs.repo-name }}
          permission-issues: write
      # Workflow tokens cannot reach organization projects at all. Project items only
      # show which issue they hold to a token that can read that issue, so this token
      # also gets Issues: read, limited to the synced repository when it belongs to the
      # project's owner (otherwise to the App's installed repositories of that owner).
      - name: Projects token
        id: projects-token
        if: inputs.app-client-id != '' && steps.config.outputs.project-owner != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.config.outputs.project-owner }}
          repositories: ${{ steps.config.outputs.repo-owner == steps.config.outputs.project-owner && steps.config.outputs.repo-name || '' }}
          permission-organization-projects: write
          permission-issues: read
      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.github-token || steps.issues-token.outputs.token || github.token }}
          GH_PROJECT_TOKEN: ${{ secrets.project-token || steps.projects-token.outputs.token }}
          JIRA_EMAIL: ${{ secrets.jira-email }}
          JIRA_API_TOKEN: ${{ secrets.jira-api-token }}
          JIRA_CLIENT_ID: ${{ secrets.jira-client-id }}
          JIRA_CLIENT_SECRET: ${{ secrets.jira-client-secret }}
          APPLY: ${{ inputs.apply }}
          INITIALIZE: ${{ inputs.initialize }}
          CONFIG: ${{ inputs.config }}
          BRANCH: ${{ inputs.state-branch }}
        run: |
          args=(--config "$CONFIG" --git-state-branch "$BRANCH"
                --state "$RUNNER_TEMP/state/state.json" --report "$RUNNER_TEMP/sync-report.json")
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          if [ "$INITIALIZE" = true ]; then args+=(--init-state); fi
          "$RUNNER_TEMP/gh-jira-sync" "${args[@]}"
      - name: Show report
        if: always()
        env:
          BRANCH: ${{ inputs.state-branch }}
        run: |
          if [ -f "$RUNNER_TEMP/sync-report.json" ]; then
            {
              echo "### gh-jira-sync: $BRANCH"
              echo '```json'
              cat "$RUNNER_TEMP/sync-report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
