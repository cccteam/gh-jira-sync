name: gh-jira-sync
# Reusable workflow: call it from any repository to run one sync deployment.
# Each deployment needs its own config file and its own state branch.
on:
  workflow_call:
    inputs:
      config:
        description: Path to the sync configuration in the calling repository
        type: string
        default: sync.json
      state-branch:
        description: Dedicated state branch in the calling repository (sync-state or sync-state-<name>)
        type: string
        default: sync-state
      apply:
        description: Apply remote changes (otherwise dry-run)
        type: boolean
        default: false
      initialize:
        description: Allow first-run state initialization
        type: boolean
        default: false
      tool-ref:
        description: Ref of cccteam/gh-jira-sync to build; pin it to the same ref as `uses:`
        type: string
        default: main
      app-client-id:
        description: >-
          Client ID of a GitHub App that supplies every GitHub token: Contents read on
          cccteam/gh-jira-sync, Issues read/write on the configured repository, and
          organization Projects read/write for project_status. Each run mints a separate
          short-lived token per purpose, limited to that repository and permission.
        type: string
        default: ''
    secrets:
      jira-email:
        description: Jira Cloud service account email
        required: true
      jira-api-token:
        description: API token for that account
        required: true
      app-private-key:
        description: Private key of the GitHub App named by app-client-id
        required: false
      # Alternatives to the App, for callers that cannot use one. Each, when passed,
      # takes precedence over the matching App token.
      github-token:
        description: >-
          Token with issue read/write on the configured repository. Without it or the
          App, the caller's GITHUB_TOKEN is used, which only covers the calling repository.
        required: false
      tool-token:
        description: Token with read access to cccteam/gh-jira-sync, for callers in other repositories without the App
        required: false
      project-token:
        description: >-
          Token with Projects read/write for project_status, for example a fine-grained
          token for a user-owned project.
        required: false

jobs:
  sync:
    # Only trusted default-branch code may run with secrets. Scheduled runs always use
    # the default branch, and their event payload carries no repository details.
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One writer per state branch; never cancel a run mid-journal.
    concurrency:
      group: gh-jira-sync-${{ github.repository }}-${{ inputs.state-branch }}
      cancel-in-progress: false
    steps:
      # The calling repository: its config, and the remote that holds the state branch.
      # The workflow's own token pushes the state branch; App tokens never need contents write.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Which repository and project owner to mint tokens for comes from the config.
      - name: Read config
        id: config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          repo=$(jq -r '.repository // ""' "$CONFIG")
          project_owner=$(jq -r '.project_status.owner // ""' "$CONFIG")
          if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || [[ ! "$project_owner" =~ ^[A-Za-z0-9-]*$ ]]; then
            echo "::error::$CONFIG needs a repository of the form owner/name"
            exit 1
          fi
          {
            echo "repo-owner=${repo%%/*}"
            echo "repo-name=${repo#*/}"
            echo "project-owner=$project_owner"
          } >> "$GITHUB_OUTPUT"
      # Each App token below covers one purpose, one repository or owner, and only the
      # permissions it needs. They expire within an hour and are revoked when the job ends.
      - name: Tool token
        id: tool-token
        if: inputs.app-client-id != '' && github.repository != 'cccteam/gh-jira-sync'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: cccteam
          repositories: gh-jira-sync
          permission-contents: read
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: cccteam/gh-jira-sync
          ref: ${{ inputs.tool-ref }}
          path: .gh-jira-sync-tool
          token: ${{ secrets.tool-token || steps.tool-token.outputs.token || github.token }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .gh-jira-sync-tool/go.mod
          cache: false
      # Built before any sync secret is in the environment.
      - name: Build
        run: |
          go build -C .gh-jira-sync-tool -o "$RUNNER_TEMP/gh-jira-sync" .
          rm -rf .gh-jira-sync-tool
      - name: Issues token
        id: issues-token
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.config.outputs.repo-owner }}
          repositories: ${{ steps.config.outputs.repo-name }}
          permission-issues: write
      # Workflow tokens cannot reach organization projects at all. Project items only
      # show which issue they hold to a token that can read that issue, so this token
      # also gets Issues: read, limited to the synced repository when it belongs to the
      # project's owner (otherwise to the App's installed repositories of that owner).
      - name: Projects token
        id: projects-token
        if: inputs.app-client-id != '' && steps.config.outputs.project-owner != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ steps.config.outputs.project-owner }}
          repositories: ${{ steps.config.outputs.repo-owner == steps.config.outputs.project-owner && steps.config.outputs.repo-name || '' }}
          permission-organization-projects: write
          permission-issues: read
      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.github-token || steps.issues-token.outputs.token || github.token }}
          GH_PROJECT_TOKEN: ${{ secrets.project-token || steps.projects-token.outputs.token }}
          JIRA_EMAIL: ${{ secrets.jira-email }}
          JIRA_API_TOKEN: ${{ secrets.jira-api-token }}
          APPLY: ${{ inputs.apply }}
          INITIALIZE: ${{ inputs.initialize }}
          CONFIG: ${{ inputs.config }}
          BRANCH: ${{ inputs.state-branch }}
        run: |
          args=(--config "$CONFIG" --git-state-branch "$BRANCH"
                --state "$RUNNER_TEMP/state/state.json" --report "$RUNNER_TEMP/sync-report.json")
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          if [ "$INITIALIZE" = true ]; then args+=(--init-state); fi
          "$RUNNER_TEMP/gh-jira-sync" "${args[@]}"
      - name: Show report
        if: always()
        env:
          BRANCH: ${{ inputs.state-branch }}
        run: |
          if [ -f "$RUNNER_TEMP/sync-report.json" ]; then
            {
              echo "### gh-jira-sync: $BRANCH"
              echo '```json'
              cat "$RUNNER_TEMP/sync-report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
