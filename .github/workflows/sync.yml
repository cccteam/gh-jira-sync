name: Sync GitHub and Jira
# This repository's own deployment: sync.json and the sync-state branch.
# Other repositories call sync-reusable.yml directly; see the README.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply remote changes (otherwise dry-run)
        type: boolean
        default: false
      initialize:
        description: Allow first-run state initialization
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: ./.github/workflows/sync-reusable.yml
    with:
      apply: ${{ inputs.apply || (github.event_name == 'schedule' && vars.SYNC_APPLY == 'true') }}
      initialize: ${{ inputs.initialize || false }}
      # Build the tool from this exact commit.
      tool-ref: ${{ github.sha }}
    secrets:
      jira-email: ${{ secrets.JIRA_EMAIL }}
      jira-api-token: ${{ secrets.JIRA_API_TOKEN }}
