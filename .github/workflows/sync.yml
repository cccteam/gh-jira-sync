name: Sync GitHub and Jira
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply remote changes (otherwise dry-run)
        type: boolean
        default: false
      initialize:
        description: Allow first-run state initialization
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'

# Use this exact group for every workflow writing this state.
concurrency:
  group: gh-jira-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    # Manual runs may only execute trusted default-branch code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Built before any secret is in the environment.
      - name: Build
        run: go build -o "$RUNNER_TEMP/gh-jira-sync" .
      - name: Reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          APPLY: ${{ inputs.apply || (github.event_name == 'schedule' && vars.SYNC_APPLY == 'true') }}
          INITIALIZE: ${{ inputs.initialize || false }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          if [ "$INITIALIZE" = true ]; then args+=(--init-state); fi
          "$RUNNER_TEMP/gh-jira-sync" --config sync.json --git-state-branch sync-state "${args[@]}"
      - name: Show report
        if: always()
        run: |
          if [ -f sync-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat sync-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
