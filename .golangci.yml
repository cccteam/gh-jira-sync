version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - noctx
    - nolintlint
    - paralleltest
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - tparallel
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 25
    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - github.com/cccteam/gh-jira-sync
    dupl:
      threshold: 100
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 50
    goconst:
      min-len: 2
      min-occurrences: 3
      # Atlassian Document Format node, mark and attribute names, and the JSON keys of
      # the GitHub and Jira payloads, are schema vocabulary: inline they read as the
      # documents they build, where a constant per word would only obscure them.
      ignore-string-values:
        - ^(type|text|content|doc|attrs|marks|href|link|em|strong|listItem|hardBreak|paragraph)$
        - ^(id|jql|maxResults|fields|properties|key|body|state|version|github_url|jira_url|comments|binding)$
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 25
    godox:
      keywords:
        - TODO
        - BUG
    misspell:
      locale: US
    nestif:
      min-complexity: 10
    tagliatelle:
      case:
        rules:
          json: camel
        use-field-name: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .Cause(
      # API is this package's own boundary to GitHub and Jira. Its implementation already
      # returns descriptive errors, and the engine inspects them (HTTP status, refusals),
      # so the engine passes them on unwrapped.
      ignore-interface-regexps:
        - ghjira\.API$
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      # JSON names are fixed by the GitHub and Jira APIs and by existing sync.json,
      # state, and report files; renaming them would break every deployment.
      - linters:
          - tagliatelle
        path: \.go$
      # Plan entries, pairs, links, and comments are passed by value on purpose: the
      # engine compares a planned snapshot with a fresh re-read, and a pointer would let
      # one alias the other.
      - linters:
          - gocritic
        text: (hugeParam|rangeValCopy)
      - linters:
          - funlen
          - gochecknoglobals
          - gochecknoinits
          - goconst
          - gocyclo
          - mnd
          - nlreturn
          - scopelint
        path: _test\.go
      # Parent test helpers take the child number so each test names its scenario,
      # even where every current caller passes the same child.
      - linters:
          - unparam
        path: parent_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
